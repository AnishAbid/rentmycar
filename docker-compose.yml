services:
  mongo:
    image: mongo:7
    container_name: rentmycar-mongo
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - rentmycar_mongo_data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  rentmycar_mongo_data:
